dependency_overrides:
  # Temporary workaround for google/flatbuffers#8935.
  # ObjectBox 5.3.2 pins affected flat_buffers 25.9.23; remove once
  # ObjectBox depends on a published flat_buffers release containing the fix.
  flat_buffers:
    git:
      url: https://github.com/google/flatbuffers.git
      ref: e7c6874192a643c50b10cb90f81c0ed84fd7f53a
      path: dart

  # Temporary workaround for flutter_map 8.3.0/8.3.1 zero-displacement
  # flings poisoning the camera with a NaN center.
  # TODO(xmattjus): remove when a pub.dev release includes fleaflet/flutter_map#2220.
  flutter_map:
    git:
      url: https://github.com/fleaflet/flutter_map.git
      ref: f779faed3afe37e70dd1e57aea0dc0a14f7a8fca

  # Temporary workaround to fix iOS and macOS runtime exceptions with higher 
  # objective_c versions on Flutter 3.41.
  # TODO(xmattjus): remove this on sdk update to >= Flutter 3.44.
  objective_c: 9.1.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/icons/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-VariableFont.ttf
        #- asset: assets/fonts/Fraunces-Italic-VariableFont.ttf
        #  style: italic
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-VariableFont.ttf

objectbox:
  # Writes objectbox-model.json and objectbox.g.dart to lib/generated (and test/generated).
  output_dir: generated
  # Or optionally specify the lib and test output folder separately.
  # output_dir:
  #   lib: custom
  #   test: other
